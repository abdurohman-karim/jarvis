name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend deps
        run: npm ci
        working-directory: frontend

      # `npm run build` generates the routify routes, type-checks and bundles
      - name: Frontend check + build
        run: npm run build
        working-directory: frontend

      - name: Build core tests
        run: cargo test -p jarvis-core --lib --no-run

      # one step per module so a failure is visible from the step list alone
      - name: Test db
        run: "cargo test -p jarvis-core --lib -- db::"
      - name: Test commands
        run: "cargo test -p jarvis-core --lib -- commands::"
      - name: Test audio
        run: "cargo test -p jarvis-core --lib -- audio"
      - name: Test lua
        run: "cargo test -p jarvis-core --lib -- lua::"
      - name: Test everything else
        run: "cargo test -p jarvis-core --lib -- --skip db:: --skip commands:: --skip audio --skip lua::"

      - name: Build assistant + cli
        run: cargo build -p jarvis-app -p jarvis-cli

      - name: GUI tests
        run: cargo test -p jarvis-gui --no-default-features

      # the IPC types the frontend imports are generated from the Rust definitions
      - name: Generated IPC types are up to date
        run: git diff --exit-code -- frontend/src/lib/ipc-types.ts

      - name: Warnings are errors
        run: cargo build -p jarvis-app -p jarvis-cli
        env:
          RUSTFLAGS: -D warnings
