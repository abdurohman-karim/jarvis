# Opens common macOS applications.

[[commands]]
id = "open_terminal"
type = "lua"
platforms = ["macos"]
script = "open_app.lua"
sandbox = "minimal"
timeout = 5000
sounds.ru = ["ok1", "ok2", "ok3"]
sounds.en = ["ok1", "ok2"]
phrases.ru = ["открой терминал", "запусти терминал"]
phrases.en = ["open terminal", "launch terminal"]
phrases.ua = ["відкрий термінал"]

